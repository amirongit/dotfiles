[general]
live_config_reload = true
ipc_socket = false
working_directory = "None"

[env]
TERM = "xterm-256color"
WINIT_X11_SCALE_FACTOR = "1.0"

[window]
dimensions = { columns = 0, lines = 0}
position = "None"
padding = { x = 2, y = 5 }
dynamic_padding = false
decorations = "Full"
opacity = 1.0
blur = false
startup_mode = "Windowed"
title = "amir@10c41h05t"
dynamic_title = false
class = { instance = "Alacritty", general = "Alacritty" }
decorations_theme_variant = "None"
resize_increments = false
option_as_alt = "None"
level = "Normal"

[scrolling]
history = 100000
multiplier = 2

[font]
normal = { family = "Agave Nerd Font", style = "Regular" }
bold = { family = "Agave Nerd Font", style = "Bold" }
italic = { family = "Agave Nerd Font", style = "Regular" }
bold_italic = { family = "Agave Nerd Font", style = "Bold" }
size = 14
offset = { x = 0, y = 0 }
builtin_box_drawing = true

# base16 Noche 256 - alacritty color config
# Teshre

# Default colors
[colors.primary]
background = '0x0c0e16'
foreground = '0xcbd4ec'

# Colors the cursor will use if `custom_cursor_colors` is true
[colors.cursor]
text = '0x0c0e16'
cursor = '0xcbd4ec'

# Normal colors
[colors.normal]
black = '0x0c0e16'
red = '0xe2727e'
green = '0x7cc596'
yellow = '0xd8c062'
blue = '0x7aa0e8'
magenta = '0xb79ae0'
cyan = '0x6dd8d0'
white = '0xcbd4ec'

# Bright colors
[colors.bright]
black = '0x5a6178'
red = '0xe2727e'
green = '0x7cc596'
yellow = '0xd8c062'
blue = '0x7aa0e8'
magenta = '0xb79ae0'
cyan = '0x6dd8d0'
white = '0xe6ecfa'

[[colors.indexed_colors]]
index = 16
color = "0x82a6e0"

[[colors.indexed_colors]]
index = 17
color = "0x3a4260"

[[colors.indexed_colors]]
index = 18
color = "0x181c2c"

[[colors.indexed_colors]]
index = 19
color = "0x232a40"

[[colors.indexed_colors]]
index = 20
color = "0x939bb2"

[[colors.indexed_colors]]
index = 21
color = "0xd9e0f3"

[bell]
animation = "Linear"
duration = 0
color = "#ffffff"
command = "None"

[selection]
save_to_clipboard = true
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"

[cursor]
style = { shape = "Block", blinking = "Always" }
vi_mode_style = "None"
blink_interval = 500
blink_timeout = 0
unfocused_hollow = true
thickness = 0.15

[terminal]
osc52 = "OnlyCopy"

[mouse]
hide_when_typing = true
bindings = []

[hints]
alphabet = "jfkdls;ahgurieowpq"

[[hints.enabled]]
command = "xdg-open"
hyperlinks = true
post_processing = true
persist = false
mouse.enabled = true
binding = { key = "O", mods = "Control|Shift" }
regex = "(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|file:|git://|ssh:|ftp://)[^\u0000-\u001F\u007F-\u009F<>\"\\s{-}\\^⟨⟩`\\\\]+"

[keyboard]
bindings = [
    { key = "V", mods = "Control|Shift", action = "Paste" },
    { key = "C", mods = "Control|Shift", action = "Copy" }
]

[debug]
render_timer = false
persistent_logging = false
log_level = "Info"
renderer = "None"
print_events = false
highlight_damage = false
prefer_egl = false
